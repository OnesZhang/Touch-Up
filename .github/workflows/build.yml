name: Build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Touch Up.app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project "Touch Up.xcodeproj" \
            -target "Touch Up" \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign & package
        run: |
          APP="build/Release/Touch Up.app"
          codesign -s - --force --deep "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Touch-Up.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Touch-Up.app
          path: Touch-Up.app.zip
          if-no-files-found: error
